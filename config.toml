# ~/.config/sfav/config.toml
# sfav looks here by default, or pass a path as the first arg: `sfav ./myconfig.toml`

# [theme] is optional — omit it entirely to get these defaults.
# Colors are "#rrggbb" hex strings.
[theme]
border = "#60a5fa"  
header = "#06b6d4"
highlight_bg = "#d4d4d8"
highlight_fg = "#18181b"

[[entries]]
name = "update"
command = "sudo dnf update -y"
notes = "full system update"

[[entries]]
name = "rice reload"
command = "hyprctl reload"
notes = "reload hyprland config"

[[entries]]
name = "luna"
command = "cd ~/piper && source ai-voice-venv/bin/activate && python main.py"
notes = "launch AI voice assistant"

[[entries]]
name = "brightness up"
command = "ddcutil setvcp 10 + 10"
notes = "bump monitor brightness"
