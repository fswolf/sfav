[package]
name = "sfav"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "A minimal TUI launcher for shell commands and scripts, inspired by sshs"
repository = "https://github.com/fswolf/sfav"
homepage = "https://github.com/fswolf/sfav"
readme = "README.md"

[dependencies]
ratatui = "0.26"
crossterm = "0.27"
serde = { version = "1", features = ["derive"] }
toml = "0.7"
